<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e2635">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RailDeutsch">
  <meta name="description" content="Német-magyar vasúti szaknyelvi leckék Ausztriához és Németországhoz.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .rd-music{background:linear-gradient(130deg,#ebf8f7,#f0f6fa);border:1px solid #d2e7e7;border-radius:17px;padding:15px;margin:15px 0}
    .rd-music-heading{display:flex;gap:11px;align-items:center;font-size:19px;color:#143848}
    .rd-music-heading strong{display:block;font-size:15px}
    .rd-music-heading small{display:block;color:#67818b;font-size:12px;margin-top:3px}
    .rd-music-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
    #rd-music-toggle{border:0;border-radius:11px;background:#0e6671;color:white;padding:11px 16px;font-weight:700}
    .rd-music-controls label{font-size:12px;color:#42616c;white-space:nowrap}
    #rd-music-volume{width:105px;max-width:100%;accent-color:#0e6671}
    .rd-music-error{color:#a32e2e;font-size:13px}
  </style>
  <title>RailDeutsch</title>
</head>
<body>
  <div id="app"></div>
  <script src="app.js" defer></script>
  <script src="music-player.js" defer></script>
</body>
</html>
